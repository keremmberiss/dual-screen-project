<!DOCTYPE html>
<html class="">
    <head>
        <meta charset="utf-8">
        <title>Dual-Screen E-Reader Panel</title>
        <style>
            .error-boundary {
                border: 2px dashed rgba(255, 0, 0, 0.3);
                position: relative;
            }
            .error-boundary::after {
                content: "⚠️";
                position: absolute;
                top: 0;
                right: 0;
                background: rgba(255, 0, 0, 0.1);
                color: red;
                font-size: 14px;
                padding: 2px 6px;
                border-radius: 0 0 0 4px;
                pointer-events: none;
            }
            .loading-spinner {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 200px;
                background: linear-gradient(to bottom right, rgba(255,255,255,0.05), rgba(255,255,255,0.1));
                border-radius: 0.75rem;
                backdrop-filter: blur(4px);
            }
            .loading-spinner::after {
                content: '';
                width: 3rem;
                height: 3rem;
                border: 4px solid rgba(0,0,0,0.1);
                border-top-color: #42362C;
                border-radius: 9999px;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: ["class"],
                theme: {
                    extend: {
                        colors: {
                            border: "hsl(var(--border, 214.3 31.8% 91.4%))",
                            background: "hsl(var(--background, 0 0% 100%))",
                            foreground: "hsl(var(--foreground, 222.2 84% 4.9%))"
                        }
                    }
                }
            }
        </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
        <script>
            window.React = React;
            window.ReactDOM = ReactDOM;
        </script>
    </head>
    <body class="bg-[#F4EFE6] text-[#2C2520]">
        <div id="root"></div>

        <script>
            const { useState, useEffect, useRef, createElement: h, Fragment } = React;

            // Lucide SVG Icon Helper
            function Icon({ name, size = 16, className = "" }) {
                const [svgHtml, setSvgHtml] = useState("");
                useEffect(() => {
                    if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
                        const svg = window.lucide.icons[name].toSvg({
                            width: size,
                            height: size,
                            class: className,
                            strokeWidth: 2
                        });
                        setSvgHtml(svg);
                    }
                }, [name, size, className]);

                return h("span", {
                    className: `inline-flex items-center justify-center ${className}`,
                    dangerouslySetInnerHTML: { __html: svgHtml }
                });
            }

            const PRESET_WALLPAPERS = [
                {
                    id: "ghibli-landscape",
                    name: "Ghibli Esintili Vadi",
                    category: "Doğa / İllüstrasyon",
                    url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=85",
                    quote: "“Günün ilk ışıklarıyla uyanan vadide dingin bir sabah.”"
                },
                {
                    id: "cozy-library",
                    name: "Gece Işığında Kütüphane",
                    category: "Kitap / İç Mekan",
                    url: "https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=2000&q=85",
                    quote: "“Kitaplar, insanın kendi içine açılan pencereleridir.”"
                },
                {
                    id: "minimalist-mountains",
                    name: "Sisli Zirveler (Japon Çini)",
                    category: "Minimalist Mürekkep",
                    url: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=85",
                    quote: "“Sessizlik, ruhun en berrak aynasıdır.”"
                },
                {
                    id: "tokyo-night",
                    name: "Sessiz Tokyo Yağmuru",
                    category: "Şehir / Manga",
                    url: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=2000&q=85",
                    quote: "“Gecenin sükunetinde yankılanan hafif yağmur damlaları.”"
                }
            ];

            const INITIAL_BOOKS = [
                {
                    id: 1,
                    title: "İçimizdeki Şeytan",
                    author: "Sabahattin Ali",
                    spread: 42,
                    totalSpreads: 182,
                    percent: 23,
                    coverUrl: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=400&q=80",
                    leftPage: "İçimizde şeytan yok... İçimizde aciz var. Tembellik var. İradesizlik, bilgisizlik ve bunların hepsinden daha korkunç olan bir şey: Hakikati görmekten kaçmak itiyadı var.\n\nKendi kusurlarımızı başkasına yüklemek ne kadar kolaysa; içimizdeki zayıflığı ‘şeytana’ havale etmek de o kadar kolay bir aldanıştır.",
                    rightPage: "Macide başını pencereye doğru çevirdi. Dışarıda alacakaranlık iniyordu. Sokak lambaları henüz yanmamıştı.\n\nÖmer'in söylediklerini dinliyor, fakat bunların arkasındaki tükenişi hissediyordu. Hayat, kelimelerin bittiği yerde başlıyordu."
                },
                {
                    id: 2,
                    title: "Dönüşüm",
                    author: "Franz Kafka",
                    spread: 12,
                    totalSpreads: 84,
                    percent: 14,
                    coverUrl: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=400&q=80",
                    leftPage: "Gregor Samsa bir sabah bunaltıcı düşlerden uyandığında, kendini yatağında devasa bir böceğe dönüşmüş olarak buldu.\n\nZırh gibi sertleşmiş sırtının üzerinde yatıyordu; başını biraz kaldırdığında yay biçimindeki kahverengi boğumlu karnını gördü.",
                    rightPage: "‘Bana ne oldu böyle?’ diye düşündü. Bu bir rüya değildi. İnsanlara özgü sakin, ancak küçük odası, dört duvarı arasında öylece duruyordu."
                },
                {
                    id: 3,
                    title: "Kürk Mantolu Madonna",
                    author: "Sabahattin Ali",
                    spread: 75,
                    totalSpreads: 110,
                    percent: 68,
                    coverUrl: "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&w=400&q=80",
                    leftPage: "Dünyanın en feci şeyi, bir insana inanıp güvenmenin boşa çıktığını görmek değil; kime inanıp güveneceğini bilememektir.",
                    rightPage: "Kaybettiğimizi sandığımız şeylerin çoğu, aslında hiç sahip olamadığımız hayallerimizden ibarettir."
                }
            ];

            function App() {
                const [isLoggedIn, setIsLoggedIn] = useState(false);
                const [currentUser, setCurrentUser] = useState(() => localStorage.getItem("reader_user") || "Havva Elif Albayrak");
                const [userProfiles, setUserProfiles] = useState(() => {
                    const saved = localStorage.getItem("reader_profiles");
                    return saved ? JSON.parse(saved) : ["Havva Elif Albayrak", "Mustafa Kerem Beriş"];
                });
                const [password, setPassword] = useState("");
                const [rememberMe, setRememberMe] = useState(true);
                const [activeTab, setActiveTab] = useState("library");
                const [books, setBooks] = useState(INITIAL_BOOKS);
                const [searchQuery, setSearchQuery] = useState("");
                const [editingBookId, setEditingBookId] = useState(null);
                const [editedTitle, setEditedTitle] = useState("");
                const [previewBook, setPreviewBook] = useState(null);

                // API & Upload States
                const [isIntegrationModalOpen, setIsIntegrationModalOpen] = useState(false);
                const [apiUrl, setApiUrl] = useState(() => {
                    return window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
                        ? "http://127.0.0.1:8000"
                        : "https://proje-backend.onrender.com";
                });
                const [selectedFile, setSelectedFile] = useState(null);
                const [isProcessingApi, setIsProcessingApi] = useState(false);
                const [apiStepMessage, setApiStepMessage] = useState("");

                // Theme & Settings
                const [activeWallpaper, setActiveWallpaper] = useState(PRESET_WALLPAPERS[0]);
                const [customImage, setCustomImage] = useState(null);
                const [wallpaperMode, setWallpaperMode] = useState("panorama");
                const [isEinkFilter, setIsEinkFilter] = useState(true);
                const [currentPw, setCurrentPw] = useState("");
                const [newPw, setNewPw] = useState("");
                const [toastMessage, setToastMessage] = useState("");

                const fileInputRef = useRef(null);
                const modalFileInputRef = useRef(null);
                const wallpaperInputRef = useRef(null);

                const displayWallpaper = customImage || activeWallpaper.url;

                const showToast = (msg) => {
                    setToastMessage(msg);
                    setTimeout(() => setToastMessage(""), 3500);
                };

                const handleSwitchUser = (val) => {
                    if (val === "new_user_prompt") {
                        const name = prompt("Yeni kullanıcı adı girin:", "");
                        if (name && name.trim()) {
                            const trimmed = name.trim();
                            if (!userProfiles.includes(trimmed)) {
                                const updated = [...userProfiles, trimmed];
                                setUserProfiles(updated);
                                localStorage.setItem("reader_profiles", JSON.stringify(updated));
                            }
                            setCurrentUser(trimmed);
                            localStorage.setItem("reader_user", trimmed);
                            showToast(`Kitaplık kullanıcısı: "${trimmed}" olarak ayarlandı.`);
                        }
                    } else {
                        setCurrentUser(val);
                        localStorage.setItem("reader_user", val);
                        showToast(`Kitaplık kullanıcısı: "${val}" seçildi.`);
                    }
                };

                const handleLogin = (e) => {
                    e.preventDefault();
                    if (!currentUser.trim()) {
                        showToast("Lütfen bir kullanıcı belirleyin.");
                        return;
                    }
                    setIsLoggedIn(true);
                    showToast(`Hoş geldin, ${currentUser}!`);
                };

                const handleLogout = () => {
                    setIsLoggedIn(false);
                    setPassword("");
                    showToast("Güvenli çıkış yapıldı.");
                };

                // Backend API Trigger Function
                const handleApiProcessSubmit = async () => {
                    if (!selectedFile) {
                        showToast("Lütfen işlenecek bir dosya seçin.");
                        return;
                    }

                    setIsProcessingApi(true);
                    setApiStepMessage("Dosya API sunucusuna aktarılıyor...");

                    const formData = new FormData();
                    formData.append("file", selectedFile);
                    formData.append("user", currentUser);

                    try {
                        setApiStepMessage("Python E-Ink motoru çalışıyor (1072×1448 render & dizgi)...");
                        const res = await fetch(`${apiUrl}/upload-and-process`, {
                            method: "POST",
                            body: formData
                        });

                        if (!res.ok) {
                            const errorData = await res.json().catch(() => ({}));
                            throw new Error(errorData.detail || errorData.message || `Sunucu Hatası (${res.status})`);
                        }

                        const data = await res.json();
                        setApiStepMessage("✅ Tamamlandı! Sayfalar üretildi ve arşive taşındı.");

                        const rawName = selectedFile.name.replace(/\.[^/.]+$/, "");
                        const cleanTitle = rawName.charAt(0).toUpperCase() + rawName.slice(1);
                        const newBook = {
                            id: Date.now(),
                            title: cleanTitle,
                            author: currentUser,
                            spread: 1,
                            totalSpreads: data.total_spreads || 120,
                            percent: 0,
                            coverUrl: "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=400&q=80",
                            leftPage: `"${cleanTitle}" eseri başarıyla dönüştürüldü.\n\nKullanıcı: ${currentUser}\nÇift Ekran Çözünürlüğü: 1072x1448 px (E-Ink Carta HD)`,
                            rightPage: `— ${currentUser} Kitaplığı —\n\nSayfalar ve manifest cihaz donanımı ile senkronize edilmeye hazır.`
                        };

                        setBooks((prev) => [newBook, ...prev]);
                        showToast(`"${cleanTitle}" başarıyla dönüştürüldü!`);

                        setTimeout(() => {
                            setIsIntegrationModalOpen(false);
                            setSelectedFile(null);
                            setIsProcessingApi(false);
                            setApiStepMessage("");
                        }, 1200);

                    } catch (err) {
                        console.error(err);
                        setApiStepMessage(`❌ Hata: ${err.message || 'API ile bağlantı kurulamadı.'}`);
                        setIsProcessingApi(false);
                    }
                };

                const handleDeleteBook = (id) => {
                    const target = books.find((b) => b.id === id);
                    setBooks((prev) => prev.filter((b) => b.id !== id));
                    showToast(`"${(target?.title) || "Kitap"}" kütüphaneden kaldırıldı.`);
                };

                const handleStartRename = (book) => {
                    setEditingBookId(book.id);
                    setEditedTitle(book.title);
                };

                const handleSaveRename = (id) => {
                    if (!editedTitle.trim()) return;
                    setBooks((prev) => prev.map((b) => b.id === id ? { ...b, title: editedTitle.trim() } : b));
                    setEditingBookId(null);
                    showToast("Kitap adı güncellendi.");
                };

                const handleCustomWallpaperUpload = (e) => {
                    const file = e.target.files?.[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            setCustomImage(event.target.result);
                            showToast("Özel karşılama görseli yüklendi ve çift ekrana dilimlendi!");
                        };
                        reader.readAsDataURL(file);
                    }
                };

                const handlePasswordChange = (e) => {
                    e.preventDefault();
                    if (!newPw.trim()) {
                        showToast("Lütfen yeni bir şifre girin.");
                        return;
                    }
                    setCurrentPw("");
                    setNewPw("");
                    showToast("Şifreniz başarıyla güncellendi.");
                };

                const filteredBooks = books.filter(
                    (b) => b.title.toLowerCase().includes(searchQuery.toLowerCase()) || b.author.toLowerCase().includes(searchQuery.toLowerCase())
                );

                // --- LOGIN EKRANI ---
                if (!isLoggedIn) {
                    return h("div", { className: "min-h-screen bg-[#F5EFE6] text-[#2C2621] font-sans flex flex-col justify-between items-center p-4 selection:bg-[#E2D4C0]" },
                        toastMessage && h("div", { className: "fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-[#28221D] text-[#FAF6F0] text-xs px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2" },
                            h(Icon, { name: "sparkles", size: 14, className: "text-[#DEB877]" }),
                            h("span", null, toastMessage)
                        ),
                        h("div", { className: "w-full" }),
                        h("div", { className: "w-full max-w-sm bg-[#FAF7F2] rounded-3xl p-7 shadow-lg border border-[#E6DCCB] flex flex-col items-center" },
                            h("div", { className: "w-14 h-14 rounded-2xl bg-[#3E342B] flex items-center justify-center text-[#FBF8F4] shadow-md mb-4" },
                                h(Icon, { name: "book-open", size: 28 })
                            ),
                            h("h1", { className: "font-serif text-xl font-bold text-[#2A231E] tracking-tight" }, "Kişisel Kitaplığın"),
                            h("p", { className: "text-xs text-[#827263] mt-1 mb-6 text-center" }, "Çift Ekranlı E-Okuyucu Yönetim Paneli"),
                            h("form", { onSubmit: handleLogin, className: "w-full space-y-4" },
                                h("div", null,
                                    h("label", { className: "block text-[11px] font-semibold text-[#665749] mb-1 uppercase tracking-wider" }, "Aktif Kullanıcı Profili"),
                                    h("div", { className: "relative flex items-center" },
                                        h("select", {
                                            value: currentUser,
                                            onChange: (e) => handleSwitchUser(e.target.value),
                                            className: "w-full bg-[#F3EDE2] text-[#2C241E] text-sm rounded-xl px-3.5 py-2.5 pl-9 border border-[#D9CEBF] focus:outline-none focus:border-[#7A634E] transition"
                                        },
                                            userProfiles.map(u => h("option", { key: u, value: u }, u)),
                                            h("option", { value: "new_user_prompt" }, "+ Yeni Kullanıcı Ekle...")
                                        ),
                                        h(Icon, { name: "user", size: 15, className: "absolute left-3 text-[#8A7969] pointer-events-none" })
                                    )
                                ),
                                h("div", null,
                                    h("label", { className: "block text-[11px] font-semibold text-[#665749] mb-1 uppercase tracking-wider" }, "Özel Şifre"),
                                    h("div", { className: "relative flex items-center" },
                                        h("input", {
                                            type: "password",
                                            value: password,
                                            onChange: (e) => setPassword(e.target.value),
                                            className: "w-full bg-[#F3EDE2] text-[#2C241E] text-sm rounded-xl px-3.5 py-2.5 pl-9 border border-[#D9CEBF] focus:outline-none focus:border-[#7A634E] transition",
                                            placeholder: "••••••••"
                                        }),
                                        h(Icon, { name: "lock", size: 15, className: "absolute left-3 text-[#8A7969] pointer-events-none" })
                                    )
                                ),
                                h("div", { className: "flex items-center justify-between text-xs text-[#716152] pt-1" },
                                    h("label", { className: "flex items-center gap-2 cursor-pointer" },
                                        h("input", {
                                            type: "checkbox",
                                            checked: rememberMe,
                                            onChange: (e) => setRememberMe(e.target.checked),
                                            className: "rounded text-[#5C4A3A] focus:ring-0 accent-[#5C4A3A]"
                                        }),
                                        h("span", null, "Beni Hatırla")
                                    ),
                                    h("span", { className: "text-[10px] text-[#A18F7E] font-mono" }, "v2.5 Dual-EInk")
                                ),
                                h("button", {
                                    type: "submit",
                                    className: "w-full mt-2 py-3 bg-[#42362C] hover:bg-[#322820] text-[#FAF6F0] text-sm font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2 active:scale-[0.99]"
                                },
                                    h("span", null, "Kitaplığa Gir"),
                                    h(Icon, { name: "arrow-right", size: 15 })
                                )
                            )
                        ),
                        h("footer", { className: "text-center py-4" },
                            h("p", { className: "text-xs text-[#8A7A6B] italic font-serif" }, `${currentUser} için özel olarak tasarlandı`)
                        )
                    );
                }

                // --- ANA EKRAN ---
                return h("div", { className: "min-h-screen bg-[#F4EFE6] text-[#2C2520] font-sans flex flex-col selection:bg-[#E0D2BE]" },
                    toastMessage && h("div", { className: "fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-[#26201B]/95 backdrop-blur text-[#FAF6F0] text-xs px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border border-[#44382F]" },
                        h(Icon, { name: "sparkles", size: 14, className: "text-[#DFB978]" }),
                        h("span", null, toastMessage)
                    ),

                    // ÜST HEADER
                    h("header", { className: "sticky top-0 z-40 bg-[#FAF7F2]/95 backdrop-blur border-b border-[#E3DACB] px-4 py-2.5 max-w-xl mx-auto w-full" },
                        h("div", { className: "flex items-center justify-between" },
                            h("div", { className: "flex items-center gap-2.5" },
                                h("div", { className: "w-8 h-8 rounded-xl bg-[#3D332A] text-[#FAF6F0] flex items-center justify-center shadow-xs" },
                                    h(Icon, { name: "book-open", size: 17 })
                                ),
                                h("div", null,
                                    h("h1", { className: "text-sm font-serif font-bold text-[#2A221C] leading-tight" }, "Kişisel Kitaplığın"),
                                    h("div", { className: "flex items-center gap-1.5 mt-0.5" },
                                        h(Icon, { name: "user", size: 10, className: "text-[#867565]" }),
                                        h("select", {
                                            value: currentUser,
                                            onChange: (e) => handleSwitchUser(e.target.value),
                                            className: "text-[11px] font-semibold bg-transparent border-none text-[#5C4A3A] p-0 focus:outline-none cursor-pointer hover:underline"
                                        },
                                            userProfiles.map(u => h("option", { key: u, value: u }, u)),
                                            h("option", { value: "new_user_prompt" }, "+ Yeni İsim Gir...")
                                        )
                                    )
                                )
                            ),
                            h("div", { className: "flex items-center gap-1.5" },
                                // Entegrasyon Butonu
                                h("button", {
                                    onClick: () => setIsIntegrationModalOpen(true),
                                    title: "Python API ile Kitap Dönüştür",
                                    className: "px-2.5 py-1.5 rounded-xl bg-[#3E342B] hover:bg-[#2B231C] text-[#FAF6F0] text-xs font-semibold flex items-center gap-1.5 transition shadow-xs"
                                },
                                    h(Icon, { name: "upload", size: 13, className: "text-[#DFB978]" }),
                                    h("span", null, "Kitap Dönüştür")
                                ),
                                h("button", {
                                    onClick: handleLogout,
                                    title: "Çıkış Yap",
                                    className: "p-2 rounded-xl text-[#786655] hover:bg-[#EDE5D6] transition"
                                },
                                    h(Icon, { name: "log-out", size: 16 })
                                )
                            )
                        )
                    ),

                    // TAB BAR
                    h("nav", { className: "max-w-xl mx-auto w-full px-4 pt-3" },
                        h("div", { className: "bg-[#E7DFCFA0] p-1 rounded-2xl flex gap-1 border border-[#D9CEBD]" },
                            h("button", {
                                onClick: () => setActiveTab("library"),
                                className: `flex-1 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition ${activeTab === "library" ? "bg-[#FAF7F2] text-[#2C231D] shadow-xs" : "text-[#736353] hover:text-[#2C231D]"}`
                            },
                                h(Icon, { name: "book-open", size: 14 }),
                                h("span", null, "Kütüphane"),
                                h("span", { className: "text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-[#ECE3D4]" }, books.length)
                            ),
                            h("button", {
                                onClick: () => setActiveTab("settings"),
                                className: `flex-1 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition ${activeTab === "settings" ? "bg-[#FAF7F2] text-[#2C231D] shadow-xs" : "text-[#736353] hover:text-[#2C231D]"}`
                            },
                                h(Icon, { name: "settings", size: 14 }),
                                h("span", null, "Ayarlar")
                            )
                        )
                    ),

                    // ANA İÇERİK
                    h("main", { className: "flex-1 max-w-xl mx-auto w-full p-4 space-y-4" },
                        activeTab === "library" && h("div", { className: "space-y-4" },
                            // Hızlı Yükleme / Dönüştürme Banner'ı
                            h("div", {
                                onClick: () => setIsIntegrationModalOpen(true),

                            h("div", { className: "grid grid-cols-2 gap-2 bg-[#F1EBE1] p-2.5 rounded-2xl border border-[#D9CDBB]" },
                                h("div", { className: "bg-[#FAF8F5] p-3 rounded-xl border border-[#E3D9C9] flex flex-col justify-between h-56 text-[10px] font-serif leading-relaxed text-[#2B231D]" },
                                    h("p", { className: "whitespace-pre-line overflow-y-auto pr-1" }, previewBook.leftPage),
                                    h("div", { className: "text-[8px] font-mono text-[#8C7B6B] pt-1 border-t border-[#EDE4D5] text-left" }, "Sayfa ", previewBook.spread * 2)
                                ),
                                h("div", { className: "bg-[#FAF8F5] p-3 rounded-xl border border-[#E3D9C9] flex flex-col justify-between h-56 text-[10px] font-serif leading-relaxed text-[#2B231D]" },
                                    h("p", { className: "whitespace-pre-line overflow-y-auto pr-1" }, previewBook.rightPage),
                                    h("div", { className: "text-[8px] font-mono text-[#8C7B6B] pt-1 border-t border-[#EDE4D5] text-right" }, "Sayfa ", previewBook.spread * 2 + 1)
                                )
                            ),
                            h("button", {
                                onClick: () => setPreviewBook(null),
                                className: "w-full py-2 bg-[#42362C] text-[#FAF6F0] rounded-xl text-xs font-semibold"
                            }, "Kapat")
                        )
                    ),

                    // FOOTER
                    h("footer", { className: "text-center py-3 text-[11px] text-[#867566] border-t border-[#E3DACB] bg-[#FAF7F2]" },
                        h("p", { className: "font-serif italic" }, `${currentUser} için sevgiyle hazırlandı`)
                    )
                );
            }

            document.addEventListener('DOMContentLoaded', function() {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(App));
            });
        </script>
    </body>
</html>
